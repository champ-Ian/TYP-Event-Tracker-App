<!DOCTYPE html>

    <script src="js/navbar.js" defer></script>

<body>
    <section id="mainPage">
    <section id="currentEvents">
        <h2 id="cur">current events</h2>
    </section>
    <section id="pastEvents">
        <h2 id="pas">past events</h2>
    </section>
<!--Bottom nav bar-->
    <nav>
        <ul>
            <li><a id="houseButtonLink" href="index.html"><i id="houseButton" class="fa-solid fa-house fa-xl" ></i></a></li>
            <li><a id="createEventButtonLink" href="create-event.html"><i id="createEventButton" class="fa-solid fa-circle-plus fa-xl"></i></a></li>
            <li><a id="profileButtonLink" href="account-in.html"><i id="profileButton" class="fa-solid fa-user fa-xl"></i></a></li>
        </ul>
    </nav>
    </section>

    <div id="darkener">

    </div>

    <!--view events pop up-->
    <section id="viewEvent">
        <div id="title">
            <h1 id="eventName">Event Name</h1>
        </div>
        <div id="middleRow">
            <div id="viewEventInfo">
                <p id="viewEventDate">xx/xx/xxxx</p>
                <p id="viewEventTime">xx:xx xx</p>
                <p id="eventCreator">creatorsName</p>
                <button id="participants">participants</button>
            </div>
            <div id="image">
                <img id="eventImage" src="img/anonymous pfp.webp" alt="image">
            </div>
        </div>
        <div id="bottomRow">
            <p>Description:</p>
            <p id="description">description goes here...</p>
        </div>
        <div id="bottomButtons">
            <button id="signUp" class="viewEventButton">RSVP</button>
            <button id="exit" class="viewEventButton">Exit</button>
        </div>

    </section>
    <script src="js/index.js"></script>
