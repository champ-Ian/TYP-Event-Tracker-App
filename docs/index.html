<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!--Upcoming/Past Events Toggle Bar-->
    <section id="toggleBar">
        <div id="togglebar1" class="aToggleBar">
            <p>Upcoming Events</p>
            <div id="upcomingEventsHLine" class="hline"></div>
        </div>
        <div id="togglebar2" class="aToggleBar">
            <p>Past Events</p>
            <div id="pastEventsHLine" class="hline"></div>
        </div>
    </section>

    <!--Upcoming Events-->
    <section id="upcomingEvents" class="upcomingEvents">
    </section>

    <!--Past Events-->
    <section id="passEvents" class="pastEvents">
    </section>

    <!--view events pop up-->
    <section id="viewEvent">
        <button id="exit" class="popupCloseButton" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>

        <div id="viewEventBody">
            <h1 id="eventName">Event Name</h1>

            <div id="viewEventInfo">
                <div class="infoChip"><i class="fa-solid fa-calendar"></i><p id="viewEventDate">xx/xx/xxxx</p></div>
                <div class="infoChip"><i class="fa-solid fa-clock"></i><p id="viewEventTime">xx:xx xx</p></div>
                <div class="infoChip"><i class="fa-solid fa-location-dot"></i><p id="viewEventLocation">location</p></div>
            </div>

            <div id="bottomRow">
                <p id="desc">Description:</p>
                <p id="description">description goes here...</p>
            </div>

            <div class="viewEventSection">
                <h3 class="viewEventSectionTitle">Event Images</h3>
                <div id="imageSection"></div>
                <div class="file-input">
                    <label class="file-button" for="imageInput">Choose File</label>
                    <span id="imageInput-name">No File Selected</span>
                    <input type="file" id="imageInput" accept="image/*">
                    <button type="button" id="addImageButton" class="addImagePlus" aria-label="Add image" hidden><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="viewEventSection">
                <h3 class="viewEventSectionTitle">Participants</h3>
                <div class="participantsRow">
                    <div id="participantList"></div>
                    <button id="signUp" class="rsvpButton">RSVP</button>
                </div>
            </div>

            <div id="creatorRow">
                <img id="creatorImage" src="img/anonymous pfp.webp" alt="creator profile picture">
                <p id="eventCreator">creatorsName</p>
                <button id="editEventButton" class="editEventButton" aria-label="Edit event" hidden><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
        </div>
    </section>

    <!--Bottom nav bar-->
    <nav>
        <ul>
            <li><a id="houseButtonLink" href="index.html"><i id="houseButton" class="fa-solid fa-house fa-xl" ></i></a></li>
            <li><a id="createEventButtonLink" href="create-event.html"><i id="createEventButton" class="fa-solid fa-circle-plus fa-xl"></i></a></li>
            <li><a id="profileButtonLink" href="account-in.html"><i id="profileButton" class="fa-solid fa-user fa-xl"></i></a></li>
        </ul>
    </nav>
    <div id="darkener">
    </div>
    <script src="js/image-utils.js"></script>
    <script src="js/index.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
